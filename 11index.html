<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ショットルート研究所 0.11</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#f4f7ff;font-family:-apple-system,BlinkMacSystemFont,sans-serif}.wrap{max-width:550px;margin:auto}header{padding:14px;font-weight:750}small,.hint{color:#afc3dc;font-size:12px}.stage{margin:0 12px;border:1px solid #465773;border-radius:12px;overflow:hidden;touch-action:none}canvas{display:block;width:100%;height:auto;touch-action:none}.controls{padding:12px;display:grid;gap:10px}.panel{background:#172338;border:1px solid #2e405b;border-radius:12px;padding:12px}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}button,.upload,select,input[type=number]{background:#263954;color:white;border:1px solid #4a6080;border-radius:9px;padding:10px;font-size:14px}button.active,.primary,.upload{background:#087bc9;border-color:#2aafff}.upload input{display:none}.hint{line-height:1.6;margin-top:7px}input[type=range]{width:100%;accent-color:#35c5f5}.setting{display:grid;grid-template-columns:1fr 80px;gap:10px;align-items:center;margin:8px 0}.setting input{width:100%}label{font-size:13px}h3{font-size:14px;margin:0 0 10px}.stat{color:#65d9ff}</style></head><body><div class="wrap"><header>🎯 ショットルート研究所 <small>Ver.0.11</small></header><div class="stage"><canvas id="board" width="420" height="720"></canvas></div><div class="controls"><div class="panel"><div class="row"><label class="upload">📷 スクショを選択<input id="photo" type="file" accept="image/*"></label><button id="autoDetect" class="primary">◎ 自動検出</button><select id="turn"><option value="auto">手番：未指定</option><option value="1">1st</option><option value="2">2nd</option><option value="3">3rd</option><option value="4">4th</option></select></div><div class="row" style="margin-top:8px"><button id="setStart">① キャラ位置</button><button id="setAim" class="active">② 角度操作</button><button id="reset">初期化</button></div><div class="hint" id="status">画像を選んでください</div><div class="hint">自動検出は暖色と青白色の発光を調べます。候補が複数ある場合は保留します。違う場所に線が出たら①キャラ位置を押し、ボール絵の中心をタップしてください。その後②角度操作で方向を調整できます。</div></div><div class="panel"><b>ショット角度 <span class="stat" id="angleText">45.00°</span></b><input type="range" id="angle" min="0" max="359.9" step="0.1" value="45"><div class="row"><button data-delta="-1">−1°</button><button data-delta="-0.1">−0.1°</button><button data-delta="0.1">＋0.1°</button><button data-delta="1">＋1°</button></div></div><div class="panel"><h3>壁・反射設定</h3><div class="setting"><label>左壁（幅%）</label><input id="wallLeft" type="number" value="0" step="0.1"></div><div class="setting"><label>右壁（幅%）</label><input id="wallRight" type="number" value="100" step="0.1"></div><div class="setting"><label>上壁（高さ%）</label><input id="wallTop" type="number" value="18.5" step="0.1"></div><div class="setting"><label>下壁（高さ%）</label><input id="wallBottom" type="number" value="69" step="0.1"></div><div class="setting"><label>ボール半径（幅%）</label><input id="radius" type="number" value="3.2" step="0.1"></div><div class="setting"><label>反射回数</label><input id="bounces" type="number" value="12" min="1" max="40"></div><label><input id="walls" type="checkbox" checked> 壁位置を表示</label> <label><input id="ball" type="checkbox" checked> ボール半径を表示</label></div><div class="panel"><button id="save" class="primary">設定を保存</button> <button id="export">ルート画像を保存</button><div class="hint">画像は端末内で処理します。自動検出は試験版です。発光円が敵の演出と重なる場合は手動指定してください。</div></div></div></div><script>
(()=>{'use strict';const $=id=>document.getElementById(id),c=$('board'),ctx=c.getContext('2d');let img=null,pos=null,angle=45,mode='aim',drag=false;const fields=['radius','wallLeft','wallRight','wallTop','wallBottom','bounces'];let saved={};try{saved=JSON.parse(localStorage.getItem('shot-route-settings-v11')||'{}')}catch(e){}fields.forEach(k=>{if(saved[k]!=null)$(k).value=saved[k]});if(Number.isFinite(saved.angle))angle=saved.angle;function num(id,d){let n=parseFloat($(id).value);return Number.isFinite(n)?n:d}function bounds(){let W=c.width,H=c.height,r=num('radius',3.2)*W/100,l=num('wallLeft',0)*W/100,rr=num('wallRight',100)*W/100,t=num('wallTop',18.5)*H/100,b=num('wallBottom',69)*H/100;return{left:l+r,right:rr-r,top:t+r,bottom:b-r,raw:{left:l,right:rr,top:t,bottom:b},r}}function setMode(m){mode=m;$('setStart').classList.toggle('active',m==='start');$('setAim').classList.toggle('active',m==='aim')}function setAngle(a){angle=(a%360+360)%360;draw()}
function detect(){
 if(!img)return;
 const w=420,h=Math.round(img.naturalHeight*w/img.naturalWidth),o=document.createElement('canvas');o.width=w;o.height=h;
 const g=o.getContext('2d',{willReadFrequently:true});g.drawImage(img,0,0,w,h);
 const d=g.getImageData(0,0,w,h).data;
 // Search the playable field, not the HP bar or portraits. Both warm and cool glows are considered.
 const yMin=Math.round(h*.18),yMax=Math.round(h*.685);
 const glow=(x,y,type)=>{x=Math.round(x);y=Math.round(y);if(x<12||x>=w-12||y<yMin||y>=yMax)return 0;
 const i=(y*w+x)*4,r=d[i],gr=d[i+1],bl=d[i+2],hi=Math.max(r,gr,bl),lo=Math.min(r,gr,bl);
 if(type===0)return r>115&&gr>48&&r>bl*1.35&&r>gr*1.12&&r-bl>65;
 if(type===1)return bl>110&&gr>95&&bl>r*1.16&&gr>r*1.18&&hi-lo>35;
 return r>165&&gr>130&&bl>110&&hi-lo<85;
 };
 const candidates=[];
 for(let cy=Math.round(h*.31);cy<Math.round(h*.668);cy+=5){
 for(let cx=24;cx<w-24;cx+=5){
  for(let type=0;type<2;type++){
   let best=0,bestR=0;
   for(let radius=21;radius<=54;radius+=4){
    let hits=0,quadrants=[0,0,0,0];
    for(let j=0;j<48;j++){
     const th=j*Math.PI/24;let ok=false;
     for(let dr=-4;dr<=4;dr+=4){if(glow(cx+(radius+dr)*Math.cos(th),cy+(radius+dr)*Math.sin(th),type)){ok=true;break}}
     if(ok){hits++;quadrants[Math.floor(j/12)]++}
    }
    const q=quadrants.filter(n=>n>=2).length;
    const score=hits+q*3;
    if(q>=2&&score>best){best=score;bestR=radius}
   }
   if(best>=20)candidates.push({x:cx,y:cy,score:best,r:bestR,type});
  }
 }
 }
 candidates.sort((a,b)=>b.score-a.score);
 const distinct=[];for(const v of candidates){if(distinct.every(q=>Math.hypot(q.x-v.x,q.y-v.y)>42))distinct.push(v);if(distinct.length===6)break}
 const best=distinct[0],second=distinct[1];
 const confidentlyUnique=best&&best.score>=35&&(!second||best.score>=second.score*1.35);
 if(confidentlyUnique){pos={x:best.x/w,y:best.y/h};setMode('aim');$('status').textContent='発光リング候補を検出（'+(best.type===0?'暖色':'青白色')+'／スコア'+best.score+'）。線の始点がボール中心に合っているか必ず確認してください。';}
 else{pos=null;setMode('start');$('status').textContent='自動判定は保留。候補 '+distinct.length+'個'+(best?'（最高スコア '+best.score+'）':'')+'。発光エフェクトだけでは手番を確定できません。①キャラ位置を選び、手番ボールの中心をタップしてください。';}
 draw();
}
function draw(){c.width=img?img.naturalWidth:420;c.height=img?img.naturalHeight:720;ctx.clearRect(0,0,c.width,c.height);if(img)ctx.drawImage(img,0,0,c.width,c.height);else{ctx.fillStyle='#1c2b44';ctx.fillRect(0,0,c.width,c.height);ctx.fillStyle='white';ctx.fillText('スクショを読み込んでください',50,300)}let B=bounds(),sc=c.width/420;if($('walls').checked){ctx.strokeStyle='#ffd166';ctx.lineWidth=2*sc;ctx.setLineDash([7*sc,6*sc]);ctx.strokeRect(B.raw.left,B.raw.top,B.raw.right-B.raw.left,B.raw.bottom-B.raw.top);ctx.strokeStyle='#2ae3f0';ctx.setLineDash([3*sc,7*sc]);ctx.strokeRect(B.left,B.top,B.right-B.left,B.bottom-B.top);ctx.setLineDash([])}if(pos){let x=Math.max(B.left,Math.min(B.right,pos.x*c.width)),y=Math.max(B.top,Math.min(B.bottom,pos.y*c.height)),rad=angle*Math.PI/180,vx=Math.cos(rad),vy=-Math.sin(rad);if(B.right>B.left&&B.bottom>B.top){for(let i=0;i<Math.min(40,Math.max(1,num('bounces',12)));i++){let tx=vx>1e-10?(B.right-x)/vx:vx< -1e-10?(B.left-x)/vx:Infinity,ty=vy>1e-10?(B.bottom-y)/vy:vy< -1e-10?(B.top-y)/vy:Infinity,dist=Math.min(tx,ty);if(!Number.isFinite(dist)||dist<0)break;let nx=x+vx*dist,ny=y+vy*dist;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(nx,ny);ctx.strokeStyle='#18e1ff';ctx.lineWidth=3*sc;ctx.stroke();ctx.fillStyle='#e7ffff';ctx.beginPath();ctx.arc(nx,ny,3*sc,0,2*Math.PI);ctx.fill();x=nx;y=ny;if(Math.abs(tx-dist)<1e-8)vx=-vx;if(Math.abs(ty-dist)<1e-8)vy=-vy;if(dist<1e-10){x+=vx*1e-7;y+=vy*1e-7}}}let sx=pos.x*c.width,sy=pos.y*c.height;ctx.beginPath();ctx.arc(sx,sy,$('ball').checked?B.r:8*sc,0,2*Math.PI);ctx.fillStyle='rgba(43,150,255,.28)';ctx.fill();ctx.strokeStyle='#9beaff';ctx.lineWidth=2*sc;ctx.stroke();let ex=sx+Math.cos(rad)*.16*c.width,ey=sy-Math.sin(rad)*.16*c.width;ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(ex,ey);ctx.strokeStyle='#ffd54d';ctx.lineWidth=4*sc;ctx.stroke();ctx.beginPath();ctx.arc(ex,ey,8*sc,0,2*Math.PI);ctx.fillStyle='#ffd54d';ctx.fill()}$('angleText').textContent=angle.toFixed(2)+'°';$('angle').value=angle}
function pointer(e){let r=c.getBoundingClientRect();return{x:Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),y:Math.max(0,Math.min(1,(e.clientY-r.top)/r.height))}}function applyPoint(p){if(mode==='start'){pos=p;$('status').textContent='手動で中心を設定しました'}else if(pos){let dx=(p.x-pos.x)*c.width,dy=(pos.y-p.y)*c.height;if(Math.hypot(dx,dy)>5)angle=(Math.atan2(dy,dx)*180/Math.PI+360)%360}draw()}c.addEventListener('pointerdown',e=>{drag=true;c.setPointerCapture(e.pointerId);applyPoint(pointer(e))});c.addEventListener('pointermove',e=>{if(drag)applyPoint(pointer(e))});['pointerup','pointercancel'].forEach(k=>c.addEventListener(k,()=>drag=false));$('setStart').onclick=()=>setMode('start');$('setAim').onclick=()=>setMode('aim');$('angle').oninput=e=>setAngle(Number(e.target.value));document.querySelectorAll('[data-delta]').forEach(b=>b.onclick=()=>setAngle(Math.round((angle+Number(b.dataset.delta))*100)/100));[...fields,'walls','ball'].forEach(k=>$(k).addEventListener('input',draw));$('photo').onchange=e=>{let f=e.target.files?.[0];if(!f)return;let rd=new FileReader();rd.onload=()=>{let im=new Image();im.onload=()=>{img=im;pos=null;draw();$('status').textContent='読み込み完了：'+f.name+' ／ 検出中';setTimeout(detect,60)};im.src=rd.result};rd.readAsDataURL(f)};$('autoDetect').onclick=detect;$('turn').onchange=()=>{if(img){pos=null;setMode('start');$('status').textContent='手番を選択しました。①キャラ位置を押し、そのボール絵の中心をタップしてください。';draw()}};$('reset').onclick=()=>{pos=null;setAngle(45);setMode('start')};$('save').onclick=()=>{let v={angle};fields.forEach(k=>v[k]=$(k).value);localStorage.setItem('shot-route-settings-v11',JSON.stringify(v));$('status').textContent='設定を保存しました'};$('export').onclick=()=>c.toBlob(blob=>{let a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download='shot-route.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)},'image/png');draw()})();
</script></body></html>
