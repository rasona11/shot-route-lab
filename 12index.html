<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ショットルート研究所 手動版</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1425;color:#f2f7ff;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif}main{max-width:760px;margin:auto;padding:14px}h1{font-size:21px;margin:12px 0}p{line-height:1.65;color:#c7d5ea}.panel{background:#182941;border:1px solid #385270;border-radius:14px;padding:15px;margin:14px 0}button,.upload{border:1px solid #4e769f;background:#087cc1;color:white;padding:13px 16px;border-radius:10px;font-size:16px;display:inline-block;margin:4px 5px 4px 0}button.secondary{background:#273c57}.upload input{display:none}canvas{display:block;max-width:100%;width:100%;height:auto;touch-action:none;border-radius:12px;background:#101e30}label{display:block;margin:12px 0 4px}input[type=range]{width:100%;accent-color:#43cfff}input[type=number]{width:85px;background:#0e1c2d;color:white;border:1px solid #6582a5;border-radius:8px;padding:9px;font-size:16px}.row{display:flex;flex-wrap:wrap;align-items:center;gap:6px}.small{font-size:13px;color:#a8c0da}.value{color:#67d9ff;font-weight:bold}#notice{color:#ffdf8a}select{background:#263b58;color:white;padding:10px;border-radius:8px;border:1px solid #6b84a4}</style></head><body><main><h1>ショットルート研究所 <span class="small">手動版 Ver.0.12</span></h1><p>自動検出はありません。画像を選び、ボール絵の中心をタップすると反射ルートを表示します。</p><div class="panel"><div class="row"><label class="upload">📷 スクショを選択<input id="file" type="file" accept="image/*"></label><button id="place">① 始点を指定</button><button id="aim" class="secondary">② 角度操作</button><button id="clear" class="secondary">始点を消す</button></div><p id="notice">スクショを選択してください。</p><canvas id="canvas" width="600" height="1100"></canvas><p class="small">① 始点を指定：画像上のボール絵の中心をタップ。② 角度操作：黄色いハンドルをドラッグして方向を調整。始点は①でいつでも修正できます。</p></div><div class="panel"><h3>ショット角度 <span class="value" id="degree">45.00°</span></h3><input id="angle" type="range" min="0" max="359.9" step="0.1" value="45"><div class="row"><button class="secondary" data-step="-1">−1°</button><button class="secondary" data-step="-0.1">−0.1°</button><button class="secondary" data-step="0.1">＋0.1°</button><button class="secondary" data-step="1">＋1°</button></div><p class="small">0°＝右、90°＝上、180°＝左、270°＝下</p></div><div class="panel"><h3>壁・反射設定</h3><p class="small">壁の位置は画像の幅・高さに対する割合です。点線で表示されます。</p><label>上壁 <span id="topV"></span>%</label><input id="top" type="range" min="0" max="80" value="13" step="0.5"><label>下壁 <span id="bottomV"></span>%</label><input id="bottom" type="range" min="20" max="100" value="74" step="0.5"><label>左壁 <span id="leftV"></span>%</label><input id="left" type="range" min="0" max="45" value="3" step="0.5"><label>右壁 <span id="rightV"></span>%</label><input id="right" type="range" min="55" max="100" value="97" step="0.5"><label>反射回数 <span id="bounceV"></span>回</label><input id="bounce" type="range" min="0" max="30" value="12" step="1"><div class="row"><button id="reset" class="secondary">壁設定を初期化</button></div></div></main><script>
(()=>{const $=id=>document.getElementById(id),canvas=$('canvas'),ctx=canvas.getContext('2d'),file=$('file');let img=null,point=null,angle=45,mode='place',drag=false;const settings=['top','bottom','left','right','bounce'];const vals=()=>Object.fromEntries(settings.map(id=>[id,+$(id).value]));function draw(){let w=canvas.width,h=canvas.height;ctx.clearRect(0,0,w,h);if(img)ctx.drawImage(img,0,0,w,h);else{ctx.fillStyle='#11223a';ctx.fillRect(0,0,w,h);ctx.fillStyle='#c7d8e9';ctx.font='24px sans-serif';ctx.textAlign='center';ctx.fillText('スクショを選択してください',w/2,h/2)}const s=vals(),L=w*s.left/100,R=w*s.right/100,T=h*s.top/100,B=h*s.bottom/100;ctx.save();ctx.setLineDash([7,8]);ctx.strokeStyle='#4be1e9';ctx.lineWidth=Math.max(2,w/300);ctx.strokeRect(L,T,R-L,B-T);ctx.restore();if(!point)return;let x=Math.max(L,Math.min(R,point.x)),y=Math.max(T,Math.min(B,point.y)),rad=angle*Math.PI/180,dx=Math.cos(rad),dy=-Math.sin(rad);ctx.beginPath();ctx.moveTo(x,y);for(let i=0;i<=s.bounce;i++){let tx=dx>1e-9?(R-x)/dx:dx< -1e-9?(L-x)/dx:Infinity,ty=dy>1e-9?(B-y)/dy:dy< -1e-9?(T-y)/dy:Infinity;let t=Math.min(tx,ty);if(!Number.isFinite(t)||t<0)break;x+=dx*t;y+=dy*t;ctx.lineTo(x,y);if(Math.abs(tx-ty)<1e-6){dx=-dx;dy=-dy}else if(tx<ty)dx=-dx;else dy=-dy;x=Math.max(L,Math.min(R,x));y=Math.max(T,Math.min(B,y))}ctx.strokeStyle='#3ce0ff';ctx.lineWidth=Math.max(2.5,w/190);ctx.lineJoin='round';ctx.stroke();const p=point;ctx.beginPath();ctx.arc(p.x,p.y,w*.018,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();ctx.lineWidth=w*.006;ctx.strokeStyle='#ffbe36';ctx.stroke();let handle={x:p.x+Math.cos(rad)*w*.15,y:p.y-Math.sin(rad)*w*.15};ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(handle.x,handle.y);ctx.strokeStyle='#ffd15a';ctx.lineWidth=w*.009;ctx.stroke();ctx.beginPath();ctx.arc(handle.x,handle.y,w*.017,0,Math.PI*2);ctx.fillStyle='#ffd15a';ctx.fill()}
function setMode(v){mode=v;$('place').className=v==='place'?'':'secondary';$('aim').className=v==='aim'?'':'secondary';$('notice').textContent=v==='place'?'画像のボール絵の中心をタップしてください。':'黄色いハンドルを動かして角度を調整できます。'}function coord(e){let r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height}}function moveAngle(p){angle=(Math.atan2(point.y-p.y,p.x-point.x)*180/Math.PI+360)%360;$('angle').value=angle;$('degree').textContent=angle.toFixed(2)+'°';draw()}canvas.addEventListener('pointerdown',e=>{if(!img)return;e.preventDefault();let p=coord(e);if(mode==='place'||!point){point=p;setMode('aim');draw()}else{drag=true;canvas.setPointerCapture(e.pointerId);moveAngle(p)}});canvas.addEventListener('pointermove',e=>{if(drag&&point)moveAngle(coord(e))});for(let event of ['pointerup','pointercancel'])canvas.addEventListener(event,()=>drag=false);file.addEventListener('change',e=>{let f=e.target.files[0];if(!f)return;let url=URL.createObjectURL(f),im=new Image();im.onload=()=>{img=im;canvas.width=im.naturalWidth;canvas.height=im.naturalHeight;point=null;setMode('place');draw();URL.revokeObjectURL(url)};im.onerror=()=>{$('notice').textContent='画像を読み込めませんでした。';URL.revokeObjectURL(url)};im.src=url});$('place').onclick=()=>setMode('place');$('aim').onclick=()=>{if(!point){setMode('place');return}setMode('aim')};$('clear').onclick=()=>{point=null;setMode('place');draw()};$('angle').oninput=e=>{angle=+e.target.value;$('degree').textContent=angle.toFixed(2)+'°';draw()};document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{angle=(angle+ +b.dataset.step+360)%360;$('angle').value=angle;$('degree').textContent=angle.toFixed(2)+'°';draw()});settings.forEach(id=>{$(id).oninput=()=>{settings.forEach(k=>$(k+'V').textContent=$(k).value);draw()}});$('reset').onclick=()=>{Object.entries({top:13,bottom:74,left:3,right:97,bounce:12}).forEach(([k,v])=>$(k).value=v);settings.forEach(k=>$(k+'V').textContent=$(k).value);draw()};settings.forEach(k=>$(k+'V').textContent=$(k).value);draw()})();
</script></body></html>
