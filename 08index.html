<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ショットルート研究所 0.8</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#f4f7ff;font-family:-apple-system,BlinkMacSystemFont,sans-serif}.wrap{max-width:550px;margin:auto}header{padding:14px;font-size:19px;font-weight:750;display:flex;justify-content:space-between}small,.hint{color:#a5b7d0;font-size:12px}.stage{margin:0 12px;border:1px solid #465773;border-radius:12px;overflow:hidden;touch-action:none}canvas{display:block;width:100%;height:auto;touch-action:none}.controls{padding:12px;display:grid;gap:10px}.panel{background:#172338;border:1px solid #2e405b;border-radius:12px;padding:12px}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}button,.upload,select,input[type=number]{background:#263954;color:white;border:1px solid #4a6080;border-radius:9px;padding:10px;font-size:14px}button.active,.primary{background:#087bc9;border-color:#2aafff}.upload input{display:none}.hint{line-height:1.6;margin-top:7px}input[type=range]{width:100%;accent-color:#35c5f5}.setting{display:grid;grid-template-columns:1fr 80px;gap:10px;align-items:center;margin:8px 0}.setting input{width:100%}label{font-size:13px}h3{font-size:14px;margin:0 0 10px}.stat{color:#65d9ff}#toast{position:fixed;bottom:20px;left:10%;width:80%;background:#2c465e;padding:10px;text-align:center;border-radius:9px;display:none}</style></head><body><div class="wrap"><header>🎯 ショットルート研究所 <small>公開版 0.8</small></header><div class="stage"><canvas id="board" width="420" height="720"></canvas></div><div class="controls"><div class="panel"><div class="row"><label class="upload primary">📷 スクショを選択<input id="photo" type="file" accept="image/*"></label><button id="autoDetect" class="primary">◎ 自動検出</button><select id="turn"><option value="auto">手番：自動</option><option value="1">1st</option><option value="2">2nd</option><option value="3">3rd</option><option value="4">4th</option></select></div><div class="row" style="margin-top:8px"><button id="setStart" class="active">① キャラ位置</button><button id="setAim">② 角度操作</button><button id="reset">初期化</button></div><div class="hint" id="uploadStatus">画像未選択</div><div class="hint" id="detectStatus">自動検出：画像を選んでください</div><div class="hint">手番の判定は下のキャラ枠の上端を比較します。オレンジ色の円は手番キャラの周囲だけから探します。ズレたら「① キャラ位置」で中心をタップし、「② 角度操作」で方向を調整してください。</div></div><div class="panel"><b>ショット角度 <span class="stat" id="angleText">45.00°</span></b><input type="range" id="angle" min="0" max="359.9" step="0.1" value="45"><div class="row"><button data-delta="-1">−1°</button><button data-delta="-0.1">−0.1°</button><button data-delta="0.1">＋0.1°</button><button data-delta="1">＋1°</button></div></div><div class="panel"><h3>壁・反射設定</h3><div class="hint">黄色い点線が壁、水色の点線がボール中心の反射境界です。</div><div class="setting"><label>左壁（幅%）</label><input id="wallLeft" type="number" value="0" step="0.1"></div><div class="setting"><label>右壁（幅%）</label><input id="wallRight" type="number" value="100" step="0.1"></div><div class="setting"><label>上壁（高さ%）</label><input id="wallTop" type="number" value="18.5" step="0.1"></div><div class="setting"><label>下壁（高さ%）</label><input id="wallBottom" type="number" value="69" step="0.1"></div><div class="setting"><label>ボール半径（幅%）</label><input id="radius" type="number" value="3.2" step="0.1"></div><div class="setting"><label>反射回数</label><input id="bounces" type="number" value="12" min="1" max="40"></div><div class="row"><label><input id="walls" type="checkbox" checked> 壁位置を表示</label><label><input id="ball" type="checkbox" checked> ボール半径を表示</label></div></div><div class="panel"><div class="row"><button id="save" class="primary">設定を保存</button><button id="export">ルート画像を保存</button></div><div class="hint">検出は試験版です。画像内のエフェクトによっては手動補正が必要です。画像は端末内で処理します。</div></div></div></div><div id="toast"></div><script>
(()=>{'use strict';const c=document.getElementById('board'),ctx=c.getContext('2d'),$=id=>document.getElementById(id);let img=null,mode='start',pos={x:.5,y:.55},angle=45,drag=false;const fields=['radius','wallLeft','wallRight','wallTop','wallBottom','bounces'];let saved={};try{saved=JSON.parse(localStorage.getItem('shot-route-settings-v08')||'{}')}catch(e){}fields.forEach(k=>{if(saved[k]!=null)$(k).value=saved[k]});if(saved.pos)pos=saved.pos;if(Number.isFinite(saved.angle))angle=saved.angle;function toast(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',2200)}function num(id,d){let v=parseFloat($(id).value);return Number.isFinite(v)?v:d}function bounds(){let W=c.width,H=c.height,r=num('radius',3.2)*W/100,l=num('wallLeft',0)*W/100,rr=num('wallRight',100)*W/100,t=num('wallTop',18.5)*H/100,b=num('wallBottom',69)*H/100;return{left:l+r,right:rr-r,top:t+r,bottom:b-r,raw:{left:l,right:rr,top:t,bottom:b},r}}function size(){c.width=img?img.naturalWidth:420;c.height=img?img.naturalHeight:720}
function autoDetect(){if(!img){toast('先にスクショを読み込んでください');return}let W=img.naturalWidth,H=img.naturalHeight,w=420,h=Math.round(H*420/W),off=document.createElement('canvas');off.width=w;off.height=h;let oc=off.getContext('2d',{willReadFrequently:true});oc.drawImage(img,0,0,w,h);let p=oc.getImageData(0,0,w,h).data;function rgb(x,y){x=Math.max(0,Math.min(w-1,Math.round(x)));y=Math.max(0,Math.min(h-1,Math.round(y)));let i=(y*w+x)*4;return[p[i],p[i+1],p[i+2]]}function orange(r,g,b){return r>155&&g>55&&g<205&&b<125&&r>g*1.27&&g>b*1.18}let portraitX=[.115,.305,.495,.685].map(x=>x*w),top=[];for(let k=0;k<4;k++){let scores=[];for(let y=Math.round(h*.705);y<h*.79;y++){let s=0;for(let dx=-w*.047;dx<=w*.047;dx+=2){let a=rgb(portraitX[k]+dx,y-3),b=rgb(portraitX[k]+dx,y+3);s+=Math.abs(a[0]+a[1]+a[2]-b[0]-b[1]-b[2])}scores.push({y,s})}scores.sort((a,b)=>b.s-a.s);top.push(scores[0]?.y||h*.75)}let order=top.map((y,i)=>({y,i})).sort((a,b)=>a.y-b.y),inferred=order[1].y-order[0].y>h*.003?order[0].i+1:0,forced=$('turn').value,turn=forced==='auto'?inferred:Number(forced);
// Detect circular orange halo ONLY near the likely active character. Character centers are estimated from localized halo geometry.
let candidates=[];let xMin=Math.round(w*.02),xMax=Math.round(w*.98),yMin=Math.round(h*.17),yMax=Math.round(h*.69);let mask=new Uint8Array(w*h);for(let y=yMin;y<yMax;y++)for(let x=xMin;x<xMax;x++){let [r,g,b]=rgb(x,y);if(orange(r,g,b))mask[y*w+x]=1}let radii=[22,27,32,38,45,53,62].map(r=>r*w/420);for(let cy=yMin+22;cy<yMax-22;cy+=5)for(let cx=xMin+22;cx<xMax-22;cx+=5){let best=0,bestR=0;for(let radius of radii){if(cx-radius<xMin||cx+radius>xMax||cy-radius<yMin||cy+radius>yMax)continue;let hits=0,segments=new Set();for(let a=0;a<48;a++){let theta=a*Math.PI/24;for(let d=-3;d<=3;d+=2){let x=Math.round(cx+(radius+d)*Math.cos(theta)),y=Math.round(cy+(radius+d)*Math.sin(theta));if(mask[y*w+x]){hits++;segments.add(Math.floor(a/4));break}}}let score=hits+segments.size*3;if(segments.size>=5&&score>best){best=score;bestR=radius}}if(best>35)candidates.push({x:cx,y:cy,score:best,r:bestR})}candidates.sort((a,b)=>b.score-a.score);let distinct=[];for(let q of candidates){if(distinct.every(v=>Math.hypot(q.x-v.x,q.y-v.y)>32))distinct.push(q);if(distinct.length>=20)break}
// The halo candidate must be consistent with the selected active character; never silently use the globally highest-scoring orange object.
let selected=null;if(turn){let expectedX=[.18,.39,.60,.81][turn-1]*w;let near=distinct.filter(q=>Math.abs(q.x-expectedX)<w*.25);if(near.length){near.sort((a,b)=>(b.score-Math.abs(b.x-expectedX)*.25)-(a.score-Math.abs(a.x-expectedX)*.25));selected=near[0]}}else if(distinct.length===1){selected=distinct[0]}
if(selected){pos={x:selected.x/w,y:selected.y/h};$('detectStatus').textContent='手番：'+(turn?turn+'番目':'不明')+' ／ オレンジ円の中心候補を設定。位置を確認してください。';setMode('aim');draw();toast('円の中心候補を設定しました')}else{$('detectStatus').textContent='手番：'+(turn?turn+'番目':'判定保留')+' ／ 円の中心は確定できません。キャラ位置をタップしてください。';toast('中心の手動補正が必要です')}}
function draw(){size();ctx.clearRect(0,0,c.width,c.height);if(img)ctx.drawImage(img,0,0,c.width,c.height);else{ctx.fillStyle='#1c2b44';ctx.fillRect(0,0,c.width,c.height);ctx.fillStyle='#a5b7d0';ctx.font='18px sans-serif';ctx.fillText('スクショを読み込んでください',c.width*.18,c.height*.5)}let B=bounds(),sc=c.width/420;if($('walls').checked){ctx.strokeStyle='#ffd166';ctx.lineWidth=2*sc;ctx.setLineDash([7*sc,6*sc]);ctx.strokeRect(B.raw.left,B.raw.top,B.raw.right-B.raw.left,B.raw.bottom-B.raw.top);ctx.strokeStyle='#2ae3f0';ctx.setLineDash([3*sc,7*sc]);ctx.strokeRect(B.left,B.top,B.right-B.left,B.bottom-B.top);ctx.setLineDash([])}let x=Math.max(B.left,Math.min(B.right,pos.x*c.width)),y=Math.max(B.top,Math.min(B.bottom,pos.y*c.height)),rad=angle*Math.PI/180,vx=Math.cos(rad),vy=-Math.sin(rad);if(B.right>B.left&&B.bottom>B.top){for(let i=0;i<Math.min(40,Math.max(1,num('bounces',12)));i++){let tx=vx>1e-10?(B.right-x)/vx:vx< -1e-10?(B.left-x)/vx:Infinity,ty=vy>1e-10?(B.bottom-y)/vy:vy< -1e-10?(B.top-y)/vy:Infinity,d=Math.min(tx,ty);if(!Number.isFinite(d)||d<0)break;let nx=x+vx*d,ny=y+vy*d;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(nx,ny);ctx.strokeStyle='#18e1ff';ctx.lineWidth=3*sc;ctx.stroke();ctx.fillStyle='#e7ffff';ctx.beginPath();ctx.arc(nx,ny,3*sc,0,2*Math.PI);ctx.fill();x=nx;y=ny;if(Math.abs(tx-d)<1e-8)vx=-vx;if(Math.abs(ty-d)<1e-8)vy=-vy;if(d<1e-10){x+=vx*1e-7;y+=vy*1e-7}}}let sx=pos.x*c.width,sy=pos.y*c.height;ctx.beginPath();ctx.arc(sx,sy,$('ball').checked?B.r:8*sc,0,2*Math.PI);ctx.fillStyle='rgba(43,150,255,.28)';ctx.fill();ctx.strokeStyle='#9beaff';ctx.lineWidth=2*sc;ctx.stroke();ctx.beginPath();ctx.arc(sx,sy,3*sc,0,2*Math.PI);ctx.fillStyle='#fff';ctx.fill();let ex=sx+Math.cos(rad)*.16*c.width,ey=sy-Math.sin(rad)*.16*c.width;ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(ex,ey);ctx.strokeStyle='#ffd54d';ctx.lineWidth=4*sc;ctx.stroke();ctx.beginPath();ctx.arc(ex,ey,8*sc,0,2*Math.PI);ctx.fillStyle='#ffd54d';ctx.fill();$('angleText').textContent=angle.toFixed(2)+'°';$('angle').value=angle}function setAngle(v){angle=((v%360)+360)%360;draw()}function setMode(m){mode=m;$('setStart').classList.toggle('active',m==='start');$('setAim').classList.toggle('active',m==='aim')}function pointer(e){let r=c.getBoundingClientRect();return{x:Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),y:Math.max(0,Math.min(1,(e.clientY-r.top)/r.height))}}function applyPoint(p){if(mode==='start')pos=p;else{let dx=(p.x-pos.x)*c.width,dy=(pos.y-p.y)*c.height;if(Math.hypot(dx,dy)>5)angle=((Math.atan2(dy,dx)*180/Math.PI)%360+360)%360}draw()}c.addEventListener('pointerdown',e=>{drag=true;c.setPointerCapture(e.pointerId);applyPoint(pointer(e))});c.addEventListener('pointermove',e=>{if(drag)applyPoint(pointer(e))});c.addEventListener('pointerup',()=>drag=false);c.addEventListener('pointercancel',()=>drag=false);$('setStart').onclick=()=>setMode('start');$('setAim').onclick=()=>setMode('aim');$('angle').oninput=e=>setAngle(parseFloat(e.target.value));document.querySelectorAll('[data-delta]').forEach(b=>b.onclick=()=>setAngle(Math.round((angle+parseFloat(b.dataset.delta))*100)/100));[...fields,'walls','ball'].forEach(k=>$(k).addEventListener('input',draw));$('photo').onchange=e=>{let f=e.target.files?.[0];if(!f)return;let rd=new FileReader();rd.onload=()=>{let im=new Image();im.onload=()=>{img=im;draw();$('uploadStatus').textContent='読み込み完了：'+f.name;setTimeout(autoDetect,80)};im.src=rd.result};rd.readAsDataURL(f)};$('autoDetect').onclick=autoDetect;$('turn').onchange=()=>{if(img)autoDetect()};$('reset').onclick=()=>{pos={x:.5,y:.55};setAngle(45);setMode('start')};$('save').onclick=()=>{let v={angle,pos};fields.forEach(k=>v[k]=$(k).value);localStorage.setItem('shot-route-settings-v08',JSON.stringify(v));toast('設定を保存しました')};$('export').onclick=()=>c.toBlob(blob=>{let a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download='shot-route.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)},'image/png');draw()})();
</script></body></html>
