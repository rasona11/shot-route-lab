<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ショットルート研究所 0.9</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#f4f7ff;font-family:-apple-system,BlinkMacSystemFont,sans-serif}.wrap{max-width:550px;margin:auto}header{padding:14px;font-weight:750}small,.hint{color:#afc3dc;font-size:12px}.stage{margin:0 12px;border:1px solid #465773;border-radius:12px;overflow:hidden;touch-action:none}canvas{display:block;width:100%;height:auto;touch-action:none}.controls{padding:12px;display:grid;gap:10px}.panel{background:#172338;border:1px solid #2e405b;border-radius:12px;padding:12px}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}button,.upload,select,input[type=number]{background:#263954;color:white;border:1px solid #4a6080;border-radius:9px;padding:10px;font-size:14px}button.active,.primary,.upload{background:#087bc9;border-color:#2aafff}.upload input{display:none}.hint{line-height:1.6;margin-top:7px}input[type=range]{width:100%;accent-color:#35c5f5}.setting{display:grid;grid-template-columns:1fr 80px;gap:10px;align-items:center;margin:8px 0}.setting input{width:100%}label{font-size:13px}h3{font-size:14px;margin:0 0 10px}.stat{color:#65d9ff}</style></head><body><div class="wrap"><header>🎯 ショットルート研究所 <small>Ver.0.9</small></header><div class="stage"><canvas id="board" width="420" height="720"></canvas></div><div class="controls"><div class="panel"><div class="row"><label class="upload">📷 スクショを選択<input id="photo" type="file" accept="image/*"></label><button id="autoDetect" class="primary">◎ 自動検出</button><select id="turn"><option value="auto">手番：自動</option><option value="1">1st</option><option value="2">2nd</option><option value="3">3rd</option><option value="4">4th</option></select></div><div class="row" style="margin-top:8px"><button id="setStart">① キャラ位置</button><button id="setAim" class="active">② 角度操作</button><button id="reset">初期化</button></div><div class="hint" id="status">画像を選んでください</div><div class="hint">オレンジ色の発光リングを優先検出します。検出できないときは前回位置を使用せず、①キャラ位置で指定してください。手番が違うときは1st〜4thを選択してください。</div></div><div class="panel"><b>ショット角度 <span class="stat" id="angleText">45.00°</span></b><input type="range" id="angle" min="0" max="359.9" step="0.1" value="45"><div class="row"><button data-delta="-1">−1°</button><button data-delta="-0.1">−0.1°</button><button data-delta="0.1">＋0.1°</button><button data-delta="1">＋1°</button></div></div><div class="panel"><h3>壁・反射設定</h3><div class="setting"><label>左壁（幅%）</label><input id="wallLeft" type="number" value="0" step="0.1"></div><div class="setting"><label>右壁（幅%）</label><input id="wallRight" type="number" value="100" step="0.1"></div><div class="setting"><label>上壁（高さ%）</label><input id="wallTop" type="number" value="18.5" step="0.1"></div><div class="setting"><label>下壁（高さ%）</label><input id="wallBottom" type="number" value="69" step="0.1"></div><div class="setting"><label>ボール半径（幅%）</label><input id="radius" type="number" value="3.2" step="0.1"></div><div class="setting"><label>反射回数</label><input id="bounces" type="number" value="12" min="1" max="40"></div><label><input id="walls" type="checkbox" checked> 壁位置を表示</label> <label><input id="ball" type="checkbox" checked> ボール半径を表示</label></div><div class="panel"><button id="save" class="primary">設定を保存</button> <button id="export">ルート画像を保存</button><div class="hint">画像は端末内で処理します。自動検出は試験版です。</div></div></div></div><script>
(()=>{'use strict';const $=id=>document.getElementById(id),c=$('board'),ctx=c.getContext('2d');let img=null,pos=null,angle=45,mode='aim',drag=false;const fields=['radius','wallLeft','wallRight','wallTop','wallBottom','bounces'];let saved={};try{saved=JSON.parse(localStorage.getItem('shot-route-settings-v09')||'{}')}catch(e){}fields.forEach(k=>{if(saved[k]!=null)$(k).value=saved[k]});if(Number.isFinite(saved.angle))angle=saved.angle;function num(id,d){let n=parseFloat($(id).value);return Number.isFinite(n)?n:d}function bounds(){let W=c.width,H=c.height,r=num('radius',3.2)*W/100,l=num('wallLeft',0)*W/100,rr=num('wallRight',100)*W/100,t=num('wallTop',18.5)*H/100,b=num('wallBottom',69)*H/100;return{left:l+r,right:rr-r,top:t+r,bottom:b-r,raw:{left:l,right:rr,top:t,bottom:b},r}}function setMode(m){mode=m;$('setStart').classList.toggle('active',m==='start');$('setAim').classList.toggle('active',m==='aim')}function setAngle(a){angle=(a%360+360)%360;draw()}
function detect(){if(!img)return;const w=360,h=Math.round(img.naturalHeight*w/img.naturalWidth),o=document.createElement('canvas');o.width=w;o.height=h;let g=o.getContext('2d',{willReadFrequently:true});g.drawImage(img,0,0,w,h);const d=g.getImageData(0,0,w,h).data;const top=Math.round(h*.17),bottom=Math.round(h*.69);function pixel(x,y){if(x<0||x>=w||y<top||y>=bottom)return 0;let i=(Math.round(y)*w+Math.round(x))*4,r=d[i],gr=d[i+1],b=d[i+2],max=Math.max(r,gr,b),min=Math.min(r,gr,b);return r>115&&r>gr*1.14&&gr>b*1.12&&max-min>65&&gr>45&&gr<230?1:0}
// Multi-scale ring detection: score angular coverage rather than area, so size and brightness may vary.
let candidates=[];for(let cy=top+16;cy<bottom-16;cy+=5)for(let cx=18;cx<w-18;cx+=5){let best=0,bestR=0;for(let radius=16;radius<=58;radius+=4){if(cx-radius<0||cx+radius>=w||cy-radius<top||cy+radius>=bottom)continue;let hits=0,quadrants=[0,0,0,0];for(let j=0;j<48;j++){let a=j*Math.PI/24,found=false;for(let dr=-3;dr<=3;dr+=2){if(pixel(cx+(radius+dr)*Math.cos(a),cy+(radius+dr)*Math.sin(a))){found=true;break}}if(found){hits++;quadrants[Math.floor(j/12)]++}}let occupied=quadrants.filter(n=>n>=2).length;let score=hits+occupied*4;if(occupied>=3&&hits>=14&&score>best){best=score;bestR=radius}}if(best>=31)candidates.push({x:cx,y:cy,r:bestR,score:best})}candidates.sort((a,b)=>b.score-a.score);let distinct=[];for(let q of candidates){if(distinct.every(v=>Math.hypot(q.x-v.x,q.y-v.y)>Math.max(22,q.r*.6)))distinct.push(q);if(distinct.length>=30)break}
// Exclude non-character effects by testing the glow's local color and typical character diameter.
let forced=$('turn').value;let chosen=null;const expectedX=[.19,.40,.60,.81];if(forced!=='auto'){let index=Number(forced)-1;let nearby=distinct.filter(q=>Math.abs(q.x/w-expectedX[index])<.35);chosen=nearby[0]||null}else{chosen=distinct[0]||null}if(chosen){pos={x:chosen.x/w,y:chosen.y/h};$('status').textContent='発光円の中心候補を検出（信頼度は未検証）。位置を確認してください。';setMode('aim')}else{pos=null;$('status').textContent='検出保留：前の位置は引き継いでいません。①キャラ位置で指定してください。';setMode('start')}draw()}
function draw(){c.width=img?img.naturalWidth:420;c.height=img?img.naturalHeight:720;ctx.clearRect(0,0,c.width,c.height);if(img)ctx.drawImage(img,0,0,c.width,c.height);else{ctx.fillStyle='#1c2b44';ctx.fillRect(0,0,c.width,c.height);ctx.fillStyle='white';ctx.fillText('スクショを読み込んでください',50,300)}let B=bounds(),sc=c.width/420;if($('walls').checked){ctx.strokeStyle='#ffd166';ctx.lineWidth=2*sc;ctx.setLineDash([7*sc,6*sc]);ctx.strokeRect(B.raw.left,B.raw.top,B.raw.right-B.raw.left,B.raw.bottom-B.raw.top);ctx.strokeStyle='#2ae3f0';ctx.setLineDash([3*sc,7*sc]);ctx.strokeRect(B.left,B.top,B.right-B.left,B.bottom-B.top);ctx.setLineDash([])}if(pos){let x=Math.max(B.left,Math.min(B.right,pos.x*c.width)),y=Math.max(B.top,Math.min(B.bottom,pos.y*c.height)),rad=angle*Math.PI/180,vx=Math.cos(rad),vy=-Math.sin(rad);if(B.right>B.left&&B.bottom>B.top){for(let i=0;i<Math.min(40,Math.max(1,num('bounces',12)));i++){let tx=vx>1e-10?(B.right-x)/vx:vx< -1e-10?(B.left-x)/vx:Infinity,ty=vy>1e-10?(B.bottom-y)/vy:vy< -1e-10?(B.top-y)/vy:Infinity,dist=Math.min(tx,ty);if(!Number.isFinite(dist)||dist<0)break;let nx=x+vx*dist,ny=y+vy*dist;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(nx,ny);ctx.strokeStyle='#18e1ff';ctx.lineWidth=3*sc;ctx.stroke();ctx.fillStyle='#e7ffff';ctx.beginPath();ctx.arc(nx,ny,3*sc,0,2*Math.PI);ctx.fill();x=nx;y=ny;if(Math.abs(tx-dist)<1e-8)vx=-vx;if(Math.abs(ty-dist)<1e-8)vy=-vy;if(dist<1e-10){x+=vx*1e-7;y+=vy*1e-7}}}let sx=pos.x*c.width,sy=pos.y*c.height;ctx.beginPath();ctx.arc(sx,sy,$('ball').checked?B.r:8*sc,0,2*Math.PI);ctx.fillStyle='rgba(43,150,255,.28)';ctx.fill();ctx.strokeStyle='#9beaff';ctx.lineWidth=2*sc;ctx.stroke();let ex=sx+Math.cos(rad)*.16*c.width,ey=sy-Math.sin(rad)*.16*c.width;ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(ex,ey);ctx.strokeStyle='#ffd54d';ctx.lineWidth=4*sc;ctx.stroke();ctx.beginPath();ctx.arc(ex,ey,8*sc,0,2*Math.PI);ctx.fillStyle='#ffd54d';ctx.fill()}$('angleText').textContent=angle.toFixed(2)+'°';$('angle').value=angle}
function pointer(e){let r=c.getBoundingClientRect();return{x:Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),y:Math.max(0,Math.min(1,(e.clientY-r.top)/r.height))}}function applyPoint(p){if(mode==='start'){pos=p;$('status').textContent='手動で中心を設定しました'}else if(pos){let dx=(p.x-pos.x)*c.width,dy=(pos.y-p.y)*c.height;if(Math.hypot(dx,dy)>5)angle=(Math.atan2(dy,dx)*180/Math.PI+360)%360}draw()}c.addEventListener('pointerdown',e=>{drag=true;c.setPointerCapture(e.pointerId);applyPoint(pointer(e))});c.addEventListener('pointermove',e=>{if(drag)applyPoint(pointer(e))});['pointerup','pointercancel'].forEach(k=>c.addEventListener(k,()=>drag=false));$('setStart').onclick=()=>setMode('start');$('setAim').onclick=()=>setMode('aim');$('angle').oninput=e=>setAngle(Number(e.target.value));document.querySelectorAll('[data-delta]').forEach(b=>b.onclick=()=>setAngle(Math.round((angle+Number(b.dataset.delta))*100)/100));[...fields,'walls','ball'].forEach(k=>$(k).addEventListener('input',draw));$('photo').onchange=e=>{let f=e.target.files?.[0];if(!f)return;let rd=new FileReader();rd.onload=()=>{let im=new Image();im.onload=()=>{img=im;pos=null;draw();$('status').textContent='読み込み完了：'+f.name+' ／ 検出中';setTimeout(detect,60)};im.src=rd.result};rd.readAsDataURL(f)};$('autoDetect').onclick=detect;$('turn').onchange=()=>{if(img)detect()};$('reset').onclick=()=>{pos=null;setAngle(45);setMode('start')};$('save').onclick=()=>{let v={angle};fields.forEach(k=>v[k]=$(k).value);localStorage.setItem('shot-route-settings-v09',JSON.stringify(v));$('status').textContent='設定を保存しました'};$('export').onclick=()=>c.toBlob(blob=>{let a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download='shot-route.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)},'image/png');draw()})();
</script></body></html>
